# Dagster 实例配置 —— 由 docker-compose 只读挂载到容器内 $DAGSTER_HOME/dagster.yaml。
#
# 为什么必须存在(2026-07-29 审计结论):
#   在此文件之前 DAGSTER_HOME 下没有任何 dagster.yaml,dagster 全部走默认值,其中
#   **run_monitoring 默认关闭**。配合 DefaultRunLauncher(run worker 是 dagster 容器内的
#   子进程),后果是:只要容器在有 run 在飞时被重建/停机,run worker 父进程被杀,run 就
#   **永远停在 STARTED**,没有任何守护会把它判失败。每发生一次就永久泄漏一个并发槽。
#   实际发生了三次(2026-07-09 dockerd 关停、07-21 与 07-22 两次 compose build && up -d),
#   累计 10 个僵尸 = QueuedRunCoordinator 的默认 max_concurrent_runs=10,队列被彻底堵死:
#   2026-07-22 06:00 UTC 起 68 个 run 全卡在 QUEUED,夜间 pull/extract 连续 7 天零执行,
#   ingest_runs 表也因此 7 天无新行。
#
# 注意 DefaultRunLauncher 的 supports_check_run_worker_health == False,所以健康检查那条
# 路径不会执行;真正回收僵尸的是 run_monitoring 末尾无条件调用的 check_run_timeout()
# (dagster/_daemon/monitoring/run_monitoring.py),它依赖 max_runtime_seconds —— 因此
# **max_runtime_seconds 必须显式设置,设 0 等于不回收**。
#
# 本文件放在仓库里而非直接写进 dagster_home 卷:卷里的手改会在重建/换机时丢失,且不受
# 版本控制(同 CLAUDE.md 对 docker update 限额被 compose 冲回的告诫)。

run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    # ── 分 job 限额(2026-07-30 内存实测后定,替代原来的单一全局闸 10)────────────────
    # 2026-07-30 夜间 9 个 run 死了 4 个,全部 memcg OOM。单一全局系数是错的抽象:
    # 真正的约束是 **extract_all 与 pull 天然重叠** —— extract 06:30 触发,而 pull 跑到 08:50。
    #
    # 实测账(容器硬限 8G;固定开销约 580MB;12% 留给 page cache,cgroup v2 的
    # memory.current 计入 file cache → 可用约 6629MB):
    #   pull_shard  (in_process) ≈ 730MB/run
    #   extract_all (in_process) ≈ 1759MB —— 内含 fastembed 模型 618MB(仅 parse 阶段加载)
    #   6×730 + 1759 + 580 = 6719  → 余 1473MB(18% 余量)✓
    #   8×730 + 1759 + 580 = 8179  → 只余 13MB ✗（这就是昨夜的死法）
    # 若哪天把 executor 改回 multiprocess,每 run 涨到约 951MB,pull 上限须同步降到 5。
    #
    # 墙钟:8 片分 2 波,估 5–6h,06:00 UTC 起约 07:00–08:00 EDT 收工,仍在开盘前。
    # 想缩短优先摘掉 FMP(端点已 403 永久下线,每片纯空转约 45min),比调系数划算。
    #
    # ✅ 2026-07-31 夜复测:memory.peak = 6.68G(模型算 6.7G),memcg OOM = 0 次。
    # ⚠️ 但那一夜真正的瓶颈是**磁盘 IO 而非内存**:nvme %util 174、831MB/s 读,
    #    而内存尚余 18%。**再上调这个系数,先撞的是 IO,不是 8G 内存闸** ——
    #    若要提并发,先解决 IO(摘 FMP / 分片错峰),否则只会把 Postgres 拖成 unhealthy,
    #    连带把 qwendrain 的 _claim() 饿住、GPU 空转(07-31 实测空转约 30 分钟)。
    #
    # ⚠️ 不要靠提高容器内存限额来解决:docker.slice 的软闸 24G 昨夜已被打满,而各容器
    #    限额之和已 22.5G。提到 12G 会把聚合推向 28G 硬闸,冲顶时受害的是整个栈
    #    (db 峰值已 100%、werss 已 100%)—— 本机是 7×24 交易机,不可接受。
    max_concurrent_runs: 7            # 总闸 = 6 pull + 1 extract
    tag_concurrency_limits:
      # key 用 dagster/schedule_name:实测 run 上确实带此 tag(runs.db 的 run_tags 已验证);
      # 没有 dagster/job_name 这个 tag,别改成那个。
      - key: "dagster/schedule_name"
        value: "pull_schedule"
        limit: 6
      - key: "dagster/schedule_name"
        value: "extract_schedule"
        limit: 1

run_monitoring:
  enabled: true
  # 僵尸回收的实际生效开关。观测到的最长正常 run 为 305 分钟(5.08h),这里留到 8h;
  # 任何超过 8h 仍存活的 run 已属病态,回收掉以释放并发槽。0 = 不回收(退回故障前行为)。
  max_runtime_seconds: 28800
  # 进入 STARTING 后多久没起来算失败(默认 180s;dagster dev 冷启动 + 依赖安装可能偏慢)。
  start_timeout_seconds: 600
  poll_interval_seconds: 120
