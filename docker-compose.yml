# XAR — turnkey stack. Set ANTHROPIC_API_KEY in .env, then: docker compose up
# Web UI -> http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: xar
      POSTGRES_PASSWORD: xar
      POSTGRES_DB: xar
    volumes:
      - xar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xar"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      XAR_DATABASE_URL: postgresql://xar:xar@db:5432/xar
      XAR_OBJECT_STORE: file:///data/objects
    # Reach a Futu OpenD gateway running on the host (only used when XAR_ENABLE_FUTU=true
    # + FUTU_OPEND_HOST=host.docker.internal in .env); inert otherwise.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: bash -lc "xar init && xar serve --host 0.0.0.0 --port 8000"
    volumes:
      - xar_data:/data
      - xar_models:/root/.cache  # fastembed model cache (persist across restarts)
    ports:
      - "8000:8000"

  # Daily auto-ingest runtime (Dagster daemon + webserver). Pulls every source
  # nightly, extracts the semantic layer, and updates the KG — the whole universe
  # split into shards. UI + run history at http://localhost:3001. Only `app`
  # creates the schema (xar init); this container just runs the scheduler.
  # GLM 订阅额度感知的常驻抽取工人:额度耗尽自动等待、恢复自动重启;
  # 持续拉取 Twitter/微信/Finnhub 语义源 + 10 年历史回填 + 钉扎 GLM 的语义抽取。
  glmworker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      XAR_DATABASE_URL: postgresql://xar:xar@db:5432/xar
      XAR_OBJECT_STORE: file:///data/objects
    extra_hosts:                              # Futu OpenD on the host (see `app`)
      - "host.docker.internal:host-gateway"
    volumes:
      - xar_data:/data
      - xar_models:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    command: bash -lc "xar glm-worker run"

  # 常驻本地 qwen 抽取 drain —— bulk KG+expert 从 glmworker 解耦到此,喂满本地 3090(算力最大化)。
  qwendrain:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      XAR_DATABASE_URL: postgresql://xar:xar@db:5432/xar
      XAR_OBJECT_STORE: file:///data/objects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - xar_data:/data
      - xar_models:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    command: bash -lc "xar qwen-drain run"

  # 常驻云端订阅并行池 —— GLM-5.2/Minimax-M3/Kimi-K3 并行跑 thesis 重建,吃满三份订阅 5h 额度窗。
  subpool:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      XAR_DATABASE_URL: postgresql://xar:xar@db:5432/xar
      XAR_OBJECT_STORE: file:///data/objects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - xar_data:/data
      - xar_models:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    command: bash -lc "xar subpool run"

  dagster:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      XAR_DATABASE_URL: postgresql://xar:xar@db:5432/xar
      XAR_OBJECT_STORE: file:///data/objects
      DAGSTER_HOME: /dagster
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    command: bash -lc "pip install '.[orchestration]' && dagster dev -m xar.orchestration.definitions -h 0.0.0.0 -p 3000"
    volumes:
      - xar_data:/data
      - xar_models:/root/.cache
      - dagster_home:/dagster
      # 实例配置从仓库只读挂入(2026-07-29 审计):开 run_monitoring,否则容器重建打死的
      # run 永远停在 STARTED、永久泄漏并发槽,攒满即全队列锁死(实际锁死过 7 天)。
      # 挂载点比 dagster_home:/dagster 更深,docker 在卷之后应用,故能覆盖。
      # 放主 compose 而非 override.yml —— 后者是 gitignored 且由 fix-minis-oom-freeze.sh
      # 生成会被重写,配置会被静默冲掉。
      - ./deploy/dagster/dagster.yaml:/dagster/dagster.yaml:ro
      # 运维脚本免 rebuild 可执行(镜像只 COPY src/,scripts/ 不在里面):
      #   docker exec main-dagster-1 python3 /opt/xar-ops/unstick_run_queue.py --apply
      - ./deploy/dagster:/opt/xar-ops:ro
    ports:
      - "3001:3000"   # host 3001 (3000 commonly taken, e.g. Grafana); Dagster UI inside still 3000

  # Optional WeChat Official Account source. Enable with:
  #   docker compose --profile wechat up -d
  # Then open http://localhost:8001, log in (scan WeChat QR), subscribe 公众号.
  # The app auto-reads it because WERSS_BASE_URL is wired to the service below.
  werss:
    image: rachelos/we-mp-rss:latest
    profiles: ["wechat"]
    volumes:
      - werss_data:/app/data
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  xar_pgdata:
  xar_data:
  xar_models:
  werss_data:
  dagster_home:
