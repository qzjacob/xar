# XAR — turnkey stack. Set ANTHROPIC_API_KEY in .env, then: docker compose up
# Web UI -> http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: xar
      POSTGRES_PASSWORD: xar
      POSTGRES_DB: xar
    volumes:
      - xar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xar"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      XAR_DATABASE_URL: postgresql://xar:xar@db:5432/xar
      XAR_OBJECT_STORE: file:///data/objects
    # Reach a Futu OpenD gateway running on the host (only used when XAR_ENABLE_FUTU=true
    # + FUTU_OPEND_HOST=host.docker.internal in .env); inert otherwise.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    command: bash -lc "xar init && xar serve --host 0.0.0.0 --port 8000"
    volumes:
      - xar_data:/data
      - xar_models:/root/.cache  # fastembed model cache (persist across restarts)
      # 宿主 cgroup 只读挂载(2026-08-01):给监控看 `docker.slice` 的聚合内存水位。
      # 容器默认只看得见**自己**的 cgroup,而 07-31 那场全栈事故的根因恰恰在聚合层:
      # subpool 无限额把 docker.slice 顶过 memory.high → 内核持续回收所有容器的页缓存
      # → refault 风暴(磁盘读 834MB/s 全是 refault)→ IO 饱和 → db unhealthy → GPU 停摆。
      # ⚠️ 关键点:越过 high **不杀进程、memory.pressure 也只有个位数**(回收是成功的),
      # 代价全转移到 IO —— 所以没有任何内存指标会报警,不挂这个就永远看不见根因。
      # 只读、只读数字,不写不改;IO PSI 走 /proc/pressure/io(容器内即可见宿主全局值)。
      - /sys/fs/cgroup:/host/cgroup:ro
    ports:
      # 监听地址可配(2026-07-31 审核 P2-1)。默认 0.0.0.0 = 保持既有行为不变。
      # ⚠️ 但要清楚这意味着什么:`/api/ops/monitor/actions` 能重启 worker、终止 dagster run,
      # 而 `_api_token_gate` **默认关**(XAR_API_TOKEN 为空时不校验)——端口一旦被网络可达,
      # 这些破坏性端点就是敞开的。代码注释里写的「硬边界是 SSH 隧道不暴露端口」需要这里配合才成立。
      # 只从本机/SSH 隧道访问 → 在 .env 设 XAR_BIND_ADDR=127.0.0.1(一行,零代码)。
      # 需要从局域网/Tailscale 直接开页面 → 保持默认,但**建议同时配上 XAR_API_TOKEN**。
      # 注意:目前 SPA 的 fetch 不发 X-API-Token(web/src/lib/ops.ts),所以armed 之后
      # 面板上的写操作会 401 —— 要么先补 SPA 带 header,要么用 XAR_BIND_ADDR 这条路。
      - "${XAR_BIND_ADDR:-0.0.0.0}:8000:8000"

  # Daily auto-ingest runtime (Dagster daemon + webserver). Pulls every source
  # nightly, extracts the semantic layer, and updates the KG — the whole universe
  # split into shards. UI + run history at http://localhost:3001. Only `app`
  # creates the schema (xar init); this container just runs the scheduler.
  # GLM 订阅额度感知的常驻抽取工人:额度耗尽自动等待、恢复自动重启;
  # 持续拉取 Twitter/微信/Finnhub 语义源 + 10 年历史回填 + 钉扎 GLM 的语义抽取。
  glmworker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      XAR_DATABASE_URL: postgresql://xar:xar@db:5432/xar
      XAR_OBJECT_STORE: file:///data/objects
    extra_hosts:                              # Futu OpenD on the host (see `app`)
      - "host.docker.internal:host-gateway"
    volumes:
      - xar_data:/data
      - xar_models:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    command: bash -lc "xar glm-worker run"

  # 常驻本地 qwen 抽取 drain —— bulk KG+expert 从 glmworker 解耦到此,喂满本地 3090(算力最大化)。
  qwendrain:
    build: .
    restart: unless-stopped
    # ⚠️ 必须给足停机宽限期(2026-07-29 审计:每次 `compose up -d` 都在静默丢文档)。
    # 本服务是全栈唯一「**领取即盖戳**」的消费者:_claim_sql 在同一条 UPDATE 里
    # `SET kg_extracted_at=now() … FOR UPDATE SKIP LOCKED`(为了并发不双抽),
    # 且刻意无回滚、无重试(毒文档语义)。于是被 SIGKILL 时,已领取未抽完的那批文档
    # kg_extracted_at 已非 NULL —— **永久跳过,静默丢失**。
    # (对比 flow_extract/triage:它们「事件落库才盖戳」,中途被杀下一轮自然重来,无此风险。)
    # SIGTERM 时的干净路径:signal → KeyboardInterrupt → return,而 ThreadPoolExecutor
    # 的 __exit__ 会 wait 在飞线程跑完 —— 实测一批约 74s(8 篇 / 4 worker),
    # 取 180s 与 llm_local_timeout_s=180 对齐:即使本批最慢那次调用一路走到超时,
    # 也来得及收尾退出。残余风险:病态卡死超过 180s 仍会被杀(那种情况本就需要监控介入)。
    stop_grace_period: 180s
    env_file: .env
    environment:
      XAR_DATABASE_URL: postgresql://xar:xar@db:5432/xar
      XAR_OBJECT_STORE: file:///data/objects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - xar_data:/data
      - xar_models:/root/.cache
    depends_on:
      db:
        condition: service_healthy
    command: bash -lc "xar qwen-drain run"

  # 常驻云端订阅并行池 —— GLM-5.2/Minimax-M3/Kimi-K3 并行跑 thesis 重建,吃满三份订阅 5h 额度窗。
  subpool:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      XAR_DATABASE_URL: postgresql://xar:xar@db:5432/xar
      XAR_OBJECT_STORE: file:///data/objects
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - xar_data:/data
      - xar_models:/root/.cache
    # ⚠️ 内存硬上限(2026-08-01 加)。此前 subpool 是全栈唯一**完全无限额**的大户,
    # 41 小时长到 14.85 GiB,把 docker.slice 顶过 memory.high(24G)。
    # 后果不是它自己被杀,而是**整个栈陪葬**:内核为压回软闸持续回收所有容器的页缓存,
    # 于是人人 refault、人人重读磁盘 —— 实测 `workingset_refault_file` 增速换算
    # 831 MB/s,与全盘实测读 834 MB/s 分毫不差,%util 打满、IO PSI 98、
    # db 转 unhealthy、qwendrain 拿不到连接、**GPU 停摆 40 分钟(0% / 6MiB / 19W)**。
    # 单纯重启 subpool 即验证:slice 24.02G → 9.28G、refault 834 → 0 MB/s、
    # IO PSI 98.33 → 0.02、db 转 healthy、GPU 秒回 96% / 336W。
    #
    # ⚠️ 归因提醒:当时读量榜首是 phantom-appsmith(452 MB/s),但它是**受害者**——
    # 工作集大、被反复驱逐、于是反复重读;真凶 subpool 自己只读 16 MB/s,却占着 14.85G。
    # **排行榜指向症状最重的,不是原因**;定位靠的是 memory.high 越界 + refault 计数对账。
    #
    # 取 4g:它刚起来时仅 957 MiB,14.85G 更像泄漏而非工作集。4g 把「无界的全栈级危害」
    # 换成「有界、可自愈的单容器重启」—— subpool **没有** qwendrain 那种领取即盖戳语义
    # (无 SKIP LOCKED / 无 stamp),被杀时在飞的 thesis 只是没写成,下轮自然重来,不丢数据。
    # 若它频繁撞顶,应当去查那 14.85G 的增长本身,而不是继续抬高这个数字。
    #
    # ⚠️ **不要照抄给 qwendrain**:它是全栈唯一「领取即盖戳、无回滚无重试」的消费者,
    # memcg OOM 是 SIGKILL、不走 stop_grace_period,在飞文档会被**永久跳过**。
    # 给它加限额等于给静默丢数据开了一条新路径,要加必须先解决领取语义。
    mem_limit: 4g
    memswap_limit: 4g
    depends_on:
      db:
        condition: service_healthy
    command: bash -lc "xar subpool run"

  dagster:
    build: .
    restart: unless-stopped
    # `dagster dev` 以 PID 1 运行,不回收孤儿进程:2026-07-30 实测容器内积了 16 个僵尸
    # (8 对 tail+python3.12,前一夜那批 run 的残留)。僵尸 RSS 为 0、不占内存,但会一直
    # 占着 PID 表项。init: true 给容器一个 tini 做 reaper,一行解决。
    init: true
    env_file: .env
    environment:
      XAR_DATABASE_URL: postgresql://xar:xar@db:5432/xar
      XAR_OBJECT_STORE: file:///data/objects
      DAGSTER_HOME: /dagster
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started
    # ⚠️ `dagster-postgres` 在这里**再写一遍**是有意的,不是冗余(2026-07-31 实证)。
    # 它已经在 pyproject 的 orchestration extra 里,但这行 `pip install '.[orchestration]'`
    # 装的是**镜像里 baked 的那份源码**(dagster 服务没挂 ./src 或 ./pyproject.toml),
    # 所以改 pyproject 对运行中的容器毫无作用 —— 必须 rebuild 才生效。
    # 而 dagster.yaml 的 storage 段一旦指向 postgres,缺这个模块就是
    # `ModuleNotFoundError: dagster_postgres` → 容器起不来 → restart: unless-stopped
    # 无限重启(实测崩了 30 次)。在命令行里显式点名,等于让启动期 pip 直接从 PyPI 取,
    # 无需 rebuild 即可自愈;下次 rebuild 后 pyproject 那份也会生效,两者版本必须一致。
    command: bash -lc "pip install '.[orchestration]' dagster-postgres==0.29.15 && dagster dev -m xar.orchestration.definitions -h 0.0.0.0 -p 3000"
    volumes:
      - xar_data:/data
      - xar_models:/root/.cache
      - dagster_home:/dagster
      # 实例配置从仓库只读挂入(2026-07-29 审计):开 run_monitoring,否则容器重建打死的
      # run 永远停在 STARTED、永久泄漏并发槽,攒满即全队列锁死(实际锁死过 7 天)。
      # 挂载点比 dagster_home:/dagster 更深,docker 在卷之后应用,故能覆盖。
      # 放主 compose 而非 override.yml —— 后者是 gitignored 且由 fix-minis-oom-freeze.sh
      # 生成会被重写,配置会被静默冲掉。
      - ./deploy/dagster/dagster.yaml:/dagster/dagster.yaml:ro
      # 运维脚本免 rebuild 可执行(镜像只 COPY src/,scripts/ 不在里面):
      #   docker exec main-dagster-1 python3 /opt/xar-ops/unstick_run_queue.py --apply
      - ./deploy/dagster:/opt/xar-ops:ro
    ports:
      - "3001:3000"   # host 3001 (3000 commonly taken, e.g. Grafana); Dagster UI inside still 3000

  # Optional WeChat Official Account source. Enable with:
  #   docker compose --profile wechat up -d
  # Then open http://localhost:8001, log in (scan WeChat QR), subscribe 公众号.
  # The app auto-reads it because WERSS_BASE_URL is wired to the service below.
  werss:
    image: rachelos/we-mp-rss:latest
    profiles: ["wechat"]
    volumes:
      - werss_data:/app/data
    ports:
      - "8001:8001"
    restart: unless-stopped

volumes:
  xar_pgdata:
  xar_data:
  xar_models:
  werss_data:
  dagster_home:
